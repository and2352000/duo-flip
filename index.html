<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="portrait">
  <title>iPhone Duo 開閉チャレンジ</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #05070d; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Helvetica Neue", sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      touch-action: none; overscroll-behavior: none;
    }
    #app {
      position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%);
      width: min(100vw, 62.5vh); overflow: hidden;
    }
    #stage, #input, #ui { position: absolute; inset: 0; }
    #stage canvas { display: block; }
    #input { touch-action: none; }
    #ui { pointer-events: none; }

    #rotate {
      position: fixed; inset: 0; z-index: 100; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      background: #05070d; text-align: center; font-size: 18px; line-height: 1.6;
    }
    #rotate .icon {
      width: 56px; height: 96px; border: 4px solid #fff; border-radius: 12px;
      animation: dg-rotate 1.8s ease-in-out infinite;
    }
    @keyframes dg-rotate {
      0%, 20% { transform: rotate(-90deg); }
      60%, 100% { transform: rotate(0deg); }
    }
    /* phones/tablets held sideways: ask to rotate back to portrait */
    @media (orientation: landscape) and (pointer: coarse) and (max-height: 600px) {
      #rotate { display: flex; }
    }
    #fatal {
      position: fixed; inset: 0; z-index: 200; display: none;
      align-items: center; justify-content: center; padding: 24px;
      background: #05070d; text-align: center;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage"></div>
    <div id="input"></div>
    <div id="ui"></div>
  </div>
  <div id="rotate">
    <div class="icon"></div>
    <div>スマホを縦向きにしてください<br>このゲームは縦画面専用です</div>
  </div>
  <div id="fatal"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/phone.js"></script>
  <script src="js/input.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
